                - code [ref=e872]:
                  - generic [ref=e873]: "# Example: Adding instructions"
                  - generic [ref=e874]: capital_agent = LlmAgent(
                  - generic [ref=e875]: model="gemini-flash-latest",
                  - generic [ref=e876]: name="capital_agent",
                  - generic [ref=e877]: description="Answers user questions about the capital city of a given country.",
                  - generic [ref=e878]: instruction="""You are an agent that provides the capital city of a country.
                  - generic [ref=e879]: "When a user asks for the capital of a country:"
                  - generic [ref=e880]: 1. Identify the country name from the user's query.
                  - generic [ref=e881]: "2. Use the `get_capital_city` tool to find the capital."
                  - generic [ref=e882]: 3. Respond clearly to the user, stating the capital city.
                  - generic [ref=e883]: "Example Query: \"What's the capital of {country}?\""
                  - generic [ref=e884]: "Example Response: \"The capital of France is Paris.\""
                  - generic [ref=e885]: "\"\"\","
                  - generic [ref=e886]: "# tools will be added next"
                  - generic [ref=e887]: )
              - button [ref=e888] [cursor=pointer]
              - button [ref=e889] [cursor=pointer]
            - paragraph [ref=e890]:
              - emphasis [ref=e891]: "(Note: For instructions that apply to"
              - text: all
              - emphasis [ref=e892]:
                - text: agents in a system, consider using
                - code [ref=e893]: global_instruction
                - text: on the root agent, detailed further in the
                - link "Multi-Agents" [ref=e894] [cursor=pointer]:
                  - /url: https://adk.dev/agents/multi-agents/
                - text: section.)
            - 'heading "Equipping the Agent: Tools (tools) ¶" [level=2] [ref=e895]':
              - text: "Equipping the Agent: Tools ("
              - code [ref=e896]: tools
              - text: )
              - link "¶" [ref=e897] [cursor=pointer]:
                - /url: https://adk.dev/agents/llm-agents/#equipping-the-agent-tools-tools
            - paragraph [ref=e898]:
              - text: Tools give your
              - code [ref=e899]: LlmAgent
              - text: capabilities beyond the LLM's built-in knowledge or reasoning. They allow the agent to interact with the outside world, perform calculations, fetch real-time data, or execute specific actions.
            - list [ref=e900]:
              - listitem [ref=e901]:
                - strong [ref=e902]:
                  - code [ref=e903]: tools
