            - heading "LLM Agent ¶" [level=1] [ref=e749]:
              - text: LLM Agent
              - link "¶" [ref=e750] [cursor=pointer]:
                - /url: https://adk.dev/agents/llm-agents/#llm-agent
            - generic [ref=e751]:
              - generic [ref=e752]: Supported in ADK
              - generic [ref=e753]: Python v0.1.0
              - generic [ref=e754]: Typescript v0.2.0
              - generic [ref=e755]: Go v0.1.0
              - generic [ref=e756]: Java v0.1.0
            - paragraph [ref=e757]:
              - text: The
              - code [ref=e758]: LlmAgent
              - text: (often aliased simply as
              - code [ref=e759]: Agent
              - text: ) is a core component in ADK, acting as the "thinking" part of your application. It leverages the power of a Large Language Model (LLM) for reasoning, understanding natural language, making decisions, generating responses, and interacting with tools.
            - paragraph [ref=e760]:
              - text: Unlike deterministic
              - link "Workflow Agents" [ref=e761] [cursor=pointer]:
                - /url: https://adk.dev/agents/workflow-agents/
              - text: that follow predefined execution paths,
              - code [ref=e762]: LlmAgent
              - text: behavior is non-deterministic. It uses the LLM to interpret instructions and context, deciding dynamically how to proceed, which tools to use (if any), or whether to transfer control to another agent.
            - paragraph [ref=e763]:
              - text: Building an effective
              - code [ref=e764]: LlmAgent
              - text: involves defining its identity, clearly guiding its behavior through instructions, and equipping it with the necessary tools and capabilities.
            - heading "Defining the Agent's Identity and Purpose ¶" [level=2] [ref=e765]:
              - text: Defining the Agent's Identity and Purpose
              - link "¶" [ref=e766] [cursor=pointer]:
                - /url: https://adk.dev/agents/llm-agents/#defining-the-agents-identity-and-purpose
            - paragraph [ref=e767]:
              - text: First, you need to establish what the agent
              - emphasis [ref=e768]: is
              - text: and what it's
              - emphasis [ref=e769]: for
              - text: .
            - list [ref=e770]:
              - listitem [ref=e771]:
                - paragraph [ref=e772]:
                  - strong [ref=e773]:
                    - code [ref=e774]: name
                    - text: "(Required):"
                  - text: Every agent needs a unique string identifier. This
                  - code [ref=e775]: name
                  - text: is crucial for internal operations, especially in multi-agent systems where agents need to refer to or delegate tasks to each other. Choose a descriptive name that reflects the agent's function (e.g.,
                  - code [ref=e776]: customer_support_router
                  - text: ","
                  - code [ref=e777]: billing_inquiry_agent
                  - text: ). Avoid reserved names like
                  - code [ref=e778]: user
                  - text: .
              - listitem [ref=e779]:
                - paragraph [ref=e780]:
                  - strong [ref=e781]:
                    - code [ref=e782]: description
                    - text: "(Optional, Recommended for Multi-Agent):"
                  - text: Provide a concise summary of the agent's capabilities. This description is primarily used by
                  - emphasis [ref=e783]: other
                  - text: LLM agents to determine if they should route a task to this agent. Make it specific enough to differentiate it from peers (e.g., "Handles inquiries about current billing statements," not just "Billing agent").
              - listitem [ref=e784]:
                - paragraph [ref=e785]:
                  - strong [ref=e786]:
                    - code [ref=e787]: model
                    - text: "(Required):"
                  - text: Specify the underlying LLM that will power this agent's reasoning. This is a string identifier like
                  - code [ref=e788]: "\"gemini-flash-latest\""
                  - text: . The choice of model impacts the agent's capabilities, cost, and performance. See the
                  - link "Models" [ref=e789] [cursor=pointer]:
                    - /url: https://adk.dev/agents/models/
                  - text: page for available options and considerations.
            - generic [ref=e790]:
              - radio "Python" [checked]
              - radio "Typescript"
              - radio "Go"
              - radio "Java"
              - generic [ref=e791]:
                - link "Python" [ref=e793] [cursor=pointer]:
