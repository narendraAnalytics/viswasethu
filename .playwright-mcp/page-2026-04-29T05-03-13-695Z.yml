            - 'heading "Guiding the Agent: Instructions (instruction) ¶" [level=2] [ref=e817]':
              - text: "Guiding the Agent: Instructions ("
              - code [ref=e818]: instruction
              - text: )
              - link "¶" [ref=e819] [cursor=pointer]:
                - /url: https://adk.dev/agents/llm-agents/#guiding-the-agent-instructions-instruction
            - paragraph [ref=e820]:
              - text: The
              - code [ref=e821]: instruction
              - text: parameter is arguably the most critical for shaping an
              - code [ref=e822]: LlmAgent
              - text: "'s behavior. It's a string (or a function returning a string) that tells the agent:"
            - list [ref=e823]:
              - listitem [ref=e824]: Its core task or goal.
              - listitem [ref=e825]: Its personality or persona (e.g., "You are a helpful assistant," "You are a witty pirate").
              - listitem [ref=e826]: Constraints on its behavior (e.g., "Only answer questions about X," "Never reveal Y").
              - listitem [ref=e827]:
                - text: How and when to use its
                - code [ref=e828]: tools
                - text: . You should explain the purpose of each tool and the circumstances under which it should be called, supplementing any descriptions within the tool itself.
              - listitem [ref=e829]: The desired format for its output (e.g., "Respond in JSON," "Provide a bulleted list").
            - paragraph [ref=e830]:
              - strong [ref=e831]: "Tips for Effective Instructions:"
            - list [ref=e832]:
              - listitem [ref=e833]:
                - strong [ref=e834]: "Be Clear and Specific:"
                - text: Avoid ambiguity. Clearly state the desired actions and outcomes.
              - listitem [ref=e835]:
                - strong [ref=e836]: "Use Markdown:"
                - text: Improve readability for complex instructions using headings, lists, etc.
              - listitem [ref=e837]:
                - strong [ref=e838]: "Provide Examples (Few-Shot):"
                - text: For complex tasks or specific output formats, include examples directly in the instruction.
              - listitem [ref=e839]:
                - strong [ref=e840]: "Guide Tool Use:"
                - text: Don't just list tools; explain
                - emphasis [ref=e841]: when
                - text: and
                - emphasis [ref=e842]: why
                - text: the agent should use them.
            - paragraph [ref=e843]:
              - strong [ref=e844]: "State:"
            - list [ref=e845]:
              - listitem [ref=e846]:
                - text: The instruction is a string template, you can use the
                - code [ref=e847]: "{var}"
                - text: syntax to insert dynamic values into the instruction.
              - listitem [ref=e848]:
                - code [ref=e849]: "{var}"
                - text: is used to insert the value of the state variable named var.
              - listitem [ref=e850]:
                - code [ref=e851]: "{artifact.var}"
                - text: is used to insert the text content of the artifact named var.
              - listitem [ref=e852]:
                - text: If the state variable or artifact does not exist, the agent will raise an error. If you want to ignore the error, you can append a
                - code [ref=e853]: "?"
                - text: to the variable name as in
                - code [ref=e854]: "{var?}"
                - text: .
            - generic [ref=e855]:
              - radio "Python" [checked]
              - radio "Typescript"
              - radio "Go"
              - radio "Java"
